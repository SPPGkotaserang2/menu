<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPPG Kota Serang 2 - Daftar Menu & Jadwal Sholat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #0284c7;
            --primary-dark: #0f172a;
            --accent: #38bdf8;
            --gold: #f59e0b;
            --card-bg: rgba(15, 23, 42, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        @keyframes dynamicGlow {
            0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
            50% { background-position: 100% 50%; filter: hue-rotate(25deg); }
            100% { background-position: 0% 50%; filter: hue-rotate(0deg); }
        }

        @keyframes cardNeonPulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.3), inset 0 0 15px rgba(56, 189, 248, 0.1);
                border-color: rgba(56, 189, 248, 0.4);
            }
            50% {
                box-shadow: 0 0 35px rgba(14, 165, 233, 0.7), inset 0 0 25px rgba(14, 165, 233, 0.25);
                border-color: rgba(56, 189, 248, 0.95);
            }
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(-45deg, #0b132b, #1c2541, #3a506b, #1d3557, #0284c7);
            background-size: 500% 500%;
            animation: dynamicGlow 12s ease infinite;
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1550px;
            background: rgba(11, 19, 43, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(2, 132, 199, 0.2);
            text-align: center;
        }

        .top-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 15px 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
        }

        .live-datetime {
            text-align: left;
        }

        .live-datetime .day-date {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .live-datetime .live-clock {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .prayer-schedule {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .prayer-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            padding-right: 15px;
            text-align: right;
        }

        .prayer-item {
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
        }

        .prayer-item .p-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
        }

        .prayer-item .p-time {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 700;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.25);
            padding-bottom: 20px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 10px var(--accent);
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: 1.5px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .periode {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .tanggal {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 500;
        }

        .period-selector-wrapper {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
        }

        .period-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .period-btn:hover {
            border-color: var(--accent);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .period-btn.active {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .menu-title {
            display: inline-block;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            padding: 8px 28px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-top: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            justify-content: center;
            margin-top: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardNeonPulse 4s ease-in-out infinite;
        }

        .card:nth-child(odd) {
            animation-delay: 2s;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
        }

        .photo-box {
            width: 100%;
            aspect-ratio: 1 / 1.414;
            background-color: #070d1d;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            position: relative;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            transition: transform 0.5s ease;
        }

        .card:hover .photo-box img {
            transform: scale(1.02);
        }

        .photo-placeholder {
            color: #cbd5e1;
            font-size: 0.9rem;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .update-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
            background: rgba(14, 165, 233, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 5px 10px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        .card-caption {
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95), transparent);
            letter-spacing: 0.5px;
        }

        @media (max-width: 1200px) {
            .top-info-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        @media (max-width: 640px) {
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-info-bar">
            <div class="live-datetime">
                <div class="day-date" id="current-day-date">Memuat Tanggal...</div>
                <div class="live-clock" id="current-clock">00:00:00 WIB</div>
            </div>
            <div class="prayer-schedule">
                <div class="prayer-title">Jadwal Sholat<br><span style="font-size:0.7rem; color:var(--text-muted);">Kota Serang</span></div>
                <div class="prayer-item">
                    <span class="p-name">Subuh</span>
                    <span class="p-time">04:41</span>
                </div>
                <div class="prayer-item">
                    <span class="p-name">Dzuhur</span>
                    <span class="p-time">12:01</span>
                </div>
                <div class="prayer-item">
                    <span class="p-name">Ashar</span>
                    <span class="p-time">15:18</span>
                </div>
                <div class="prayer-item">
                    <span class="p-name">Maghrib</span>
                    <span class="p-time">18:04</span>
                </div>
                <div class="prayer-item">
                    <span class="p-name">Isya</span>
                    <span class="p-time">19:13</span>
                </div>
            </div>
        </div>

        <header>
            <h1>SPPG KOTA SERANG 2</h1>
            <div class="periode" id="header-periode">MEMUAT PERIODE...</div>
            <div class="tanggal" id="header-tanggal">MEMUAT TANGGAL...</div>

            <div class="period-selector-wrapper" id="period-buttons"></div>

            <div class="menu-title">DAFTAR MENU</div>
        </header>

        <div class="grid-container" id="menu-grid"></div>
    </div>

    <script>
        const periods = [
            { id: 1, start: "2026-01-05", end: "2026-01-17", label: "5 JANUARI S/D 17 JANUARI 2026" },
            { id: 2, start: "2026-01-19", end: "2026-01-31", label: "19 JANUARI S/D 31 JANUARI 2026" },
            { id: 3, start: "2026-02-02", end: "2026-02-14", label: "2 FEBRUARI S/D 14 FEBRUARI 2026" },
            { id: 4, start: "2026-02-16", end: "2026-02-28", label: "16 FEBRUARI S/D 28 FEBRUARI 2026" },
            { id: 5, start: "2026-03-02", end: "2026-03-14", label: "2 MARET S/D 14 MARET 2026" },
            { id: 6, start: "2026-03-16", end: "2026-03-28", label: "16 MARET S/D 28 MARET 2026" },
            { id: 7, start: "2026-03-30", end: "2026-04-11", label: "30 MARET S/D 11 APRIL 2026" },
            { id: 8, start: "2026-04-13", end: "2026-04-25", label: "13 APRIL S/D 25 APRIL 2026" },
            { id: 9, start: "2026-04-27", end: "2026-05-09", label: "27 APRIL S/D 9 MEI 2026" },
            { id: 10, start: "2026-05-11", end: "2026-05-23", label: "11 MEI S/D 23 MEI 2026" },
            { id: 11, start: "2026-05-25", end: "2026-06-06", label: "25 MEI S/D 6 JUNI 2026" },
            { id: 12, start: "2026-06-08", end: "2026-06-20", label: "8 JUNI S/D 20 JUNI 2026" },
            { id: 13, start: "2026-06-22", end: "2026-07-04", label: "22 JUNI S/D 4 JULI 2026" },
            { id: 14, start: "2026-07-06", end: "2026-07-18", label: "6 JULI S/D 18 JULI 2026" },
            { id: 15, start: "2026-07-20", end: "2026-08-01", label: "20 JULI S/D 1 AGUSTUS 2026" },
            { id: 16, start: "2026-08-03", end: "2026-08-15", label: "3 AGUSTUS S/D 15 AGUSTUS 2026" },
            { id: 17, start: "2026-08-17", end: "2026-08-29", label: "17 AGUSTUS S/D 29 AGUSTUS 2026" },
            { id: 18, start: "2026-08-31", end: "2026-09-12", label: "31 AGUSTUS S/D 12 SEPTEMBER 2026" },
            { id: 19, start: "2026-09-14", end: "2026-09-26", label: "14 SEPTEMBER S/D 26 SEPTEMBER 2026" },
            { id: 20, start: "2026-09-28", end: "2026-10-10", label: "28 SEPTEMBER S/D 10 OKTOBER 2026" },
            { id: 21, start: "2026-10-12", end: "2026-10-24", label: "12 OKTOBER S/D 24 OKTOBER 2026" },
            { id: 22, start: "2026-10-26", end: "2026-11-07", label: "26 OKTOBER S/D 7 NOVEMBER 2026" },
            { id: 23, start: "2026-11-09", end: "2026-11-21", label: "9 NOVEMBER S/D 21 NOVEMBER 2026" },
            { id: 24, start: "2026-11-23", end: "2026-12-05", label: "23 NOVEMBER S/D 5 DESEMBER 2026" },
            { id: 25, start: "2026-12-07", end: "2026-12-19", label: "7 DESEMBER S/D 19 DESEMBER 2026" },
            { id: 26, start: "2026-12-21", end: "2026-12-31", label: "21 DESEMBER S/D 31 DESEMBER 2026" }
        ];

        let selectedPeriodId = null;

        function getDefaultActivePeriod() {
            const todayStr = new Date().toISOString().split('T')[0];
            for (let p of periods) {
                if (todayStr >= p.start && todayStr <= p.end) {
                    return p.id;
                }
            }
            if (todayStr < periods[0].start) return periods[0].id;
            return periods[periods.length - 1].id;
        }

        function generateDays(startDateStr, endDateStr) {
            let days = [];
            let curr = new Date(startDateStr);
            let end = new Date(endDateStr);

            while (curr <= end) {
                if (curr.getDay() !== 0) { // Lewati hari Minggu
                    days.push(new Date(curr));
                }
                curr.setDate(curr.getDate() + 1);
            }
            return days;
        }

        function renderButtons() {
            const wrapper = document.getElementById('period-buttons');
            wrapper.innerHTML = '';

            periods.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `period-btn ${p.id === selectedPeriodId ? 'active' : ''}`;
                btn.textContent = `P${p.id}`;
                btn.title = `${p.start} s/d ${p.end}`;
                btn.onclick = () => {
                    selectedPeriodId = p.id;
                    renderWebsite();
                    renderButtons();
                };
                wrapper.appendChild(btn);
            });
        }

        function renderWebsite() {
            const activeP = periods.find(p => p.id === selectedPeriodId) || periods[0];
            
            document.getElementById('header-periode').textContent = `PERIODE ${activeP.id}`;
            document.getElementById('header-tanggal').textContent = activeP.label;

            const daysList = generateDays(activeP.start, activeP.end);
            const gridContainer = document.getElementById('menu-grid');
            gridContainer.innerHTML = '';

            daysList.forEach((dateObj, index) => {
                const dayNum = index + 1;
                // Format penamaan file foto sesuai permintaan: 18p1.jpg, 18p2.jpg, dst.
                const timestamp = new Date().getMinutes(); 
                const fileName = `${activeP.id}p${dayNum}.jpg?t=${timestamp}`;

                const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                const formattedDateText = dateObj.toLocaleDateString('id-ID', options);
                const dateISOStr = dateObj.toISOString().split('T')[0];

                const cardHTML = `
                    <div class="card">
                        <div class="photo-box">
                            <img src="${fileName}" alt="Menu Hari ke-${dayNum}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="photo-placeholder" style="display:none;">
                                Menu Belum Tersedia
                                <span class="update-badge" data-target-date="${dateISOStr}"></span>
                            </div>
                        </div>
                        <div class="card-caption">${formattedDateText}</div>
                    </div>
                `;
                gridContainer.innerHTML += cardHTML;
            });
            updateCountdowns();
        }

        function updateClockAndDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-day-date').textContent = now.toLocaleDateString('id-ID', options);

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-clock').textContent = `${hours}:${minutes}:${seconds} WIB`;
        }

        function updateCountdowns() {
            const now = new Date();
            document.querySelectorAll('.update-badge').forEach(badge => {
                const targetDateStr = badge.getAttribute('data-target-date');
                const targetDate = new Date(targetDateStr + 'T07:00:00');
                const diff = targetDate - now;

                if (diff <= 0) {
                    badge.textContent = "Segera Hadir";
                } else {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                    let timeString = '';
                    if (days > 0) timeString += `${days}h `;
                    timeString += `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    badge.textContent = `Update: ${timeString}`;
                }
            });
        }

        // Inisialisasi awal
        selectedPeriodId = getDefaultActivePeriod();
        renderButtons();
        renderWebsite();
        updateClockAndDate();

        // Interval per detik untuk Jam & Hitung Mundur
        setInterval(() => {
            updateClockAndDate();
            updateCountdowns();
        }, 1000);

        // Auto-Sync cek pembaruan foto setiap 15 detik tanpa refresh manual
        setInterval(() => {
            renderWebsite();
        }, 15000);
    </script>
</body>
</html>
